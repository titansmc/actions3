name: Compilar C

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Compilar
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: estadistiques-win
          path: estadistiques.exe

  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Compilar
        run: make

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Compilar
        run: make
